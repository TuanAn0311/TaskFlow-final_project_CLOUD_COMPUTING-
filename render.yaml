databases:
    - name: taskflow-db
      databaseName: taskflow
      user: taskflow
      plan: free
      region: singapore
      postgresMajorVersion: "16"

services:
    - type: web
      name: taskflow-api
      runtime: node
      plan: free
      region: singapore
      buildCommand: npm ci --prefix backend
      startCommand: npm --prefix backend run migrate && npm --prefix backend start
      healthCheckPath: /api/health
      envVars:
          - key: NODE_ENV
            value: production
          - key: NODE_VERSION
            value: 22.12.0
          - key: TRUST_PROXY_HOPS
            value: "1"
          - key: DATABASE_URL
            fromDatabase:
                name: taskflow-db
                property: connectionString
          - key: SUPABASE_URL
            sync: false
          - key: SUPABASE_SERVICE_ROLE_KEY
            sync: false
          - key: SUPABASE_STORAGE_BUCKET
            value: taskflow-files
          - key: JWT_SECRET
            generateValue: true
          - key: WEB_ORIGIN
            fromService:
                type: web
                name: taskflow-web
                property: host

    - type: web
      name: taskflow-web
      runtime: static
      rootDir: web
      buildCommand: npm ci && npm run build
      staticPublishPath: dist
      envVars:
          - key: NODE_VERSION
            value: 22.12.0
          - key: VITE_API_URL
            value: https://taskflow-api-ikkr.onrender.com
